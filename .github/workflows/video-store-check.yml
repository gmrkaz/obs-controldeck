name: Video Store Check

on:
  push:
    branches:
      - video-store-bot
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile bot
        run: python -m py_compile bot.py

      - name: SQLite smoke test
        env:
          BOT_TOKEN: "dummy"
          ADMIN_ID: "1"
          DB_PATH: "/tmp/video-store-test.db"
        run: |
          python - <<'PY'
          import asyncio
          import bot

          asyncio.run(bot.init_db())
          print("SQLite smoke test OK")
          PY

      - name: Build Docker image
        run: docker build -t video-store-check .
